<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#F5F7F8"/>
  <rect x="64" y="64" width="1472" height="772" rx="40" fill="white"/>
  <rect x="64" y="64" width="1472" height="772" rx="40" stroke="#D7DEE3" stroke-width="2"/>

  <text x="120" y="170" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Inbound Tracking</text>
  <text x="120" y="250" fill="#0F1720" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">Track inbound shipments</text>
  <text x="120" y="326" fill="#0F1720" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">before they become inventory</text>
  <text x="120" y="392" fill="#4E6472" font-family="Arial, Helvetica, sans-serif" font-size="30">Upload trade documents, follow inbound status, and update stock when goods arrive.</text>

  <rect x="120" y="470" width="400" height="250" rx="28" fill="#EFF5F8" stroke="#D8E3EA"/>
  <rect x="160" y="525" width="320" height="150" rx="18" fill="white" stroke="#D8E3EA"/>
  <text x="160" y="500" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1. Upload</text>
  <text x="195" y="585" fill="#7B8E99" font-family="Arial, Helvetica, sans-serif" font-size="24">Invoice / packing list</text>
  <text x="220" y="625" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">OCR + AI</text>

  <rect x="600" y="470" width="400" height="250" rx="28" fill="#EFF5F8" stroke="#D8E3EA"/>
  <rect x="640" y="525" width="320" height="150" rx="18" fill="white" stroke="#D8E3EA"/>
  <text x="640" y="500" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2. Track</text>
  <text x="670" y="580" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="24">SI issued</text>
  <text x="670" y="620" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="24">In transit</text>
  <text x="670" y="660" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="24">Arrived</text>

  <rect x="1080" y="470" width="400" height="250" rx="28" fill="#EFF5F8" stroke="#D8E3EA"/>
  <rect x="1120" y="525" width="320" height="150" rx="18" fill="white" stroke="#D8E3EA"/>
  <text x="1120" y="500" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3. Sync</text>
  <text x="1160" y="585" fill="#7B8E99" font-family="Arial, Helvetica, sans-serif" font-size="24">Received quantity</text>
  <text x="1160" y="625" fill="#113247" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Inventory update</text>

  <circle cx="540" cy="595" r="18" fill="#DBE8EF"/>
  <circle cx="1020" cy="595" r="18" fill="#DBE8EF"/>
  <path d="M555 595H585" stroke="#86A3B5" stroke-width="6" stroke-linecap="round"/>
  <path d="M1035 595H1065" stroke="#86A3B5" stroke-width="6" stroke-linecap="round"/>
